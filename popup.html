<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bro level</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 250px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; padding: 6px 0; cursor: pointer; }
    small { display: block; color: #666; margin-left: 22px; }
    p { color: #666; font-size: 12px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h1>Bro level</h1>
  <label><input type="radio" name="level" value="normal"> Normal bro
    <small>Full sentences ending in a full stop.</small></label>
  <label><input type="radio" name="level" value="ultra"> Ultra bro
    <small>Questions and exclamations too, bro?!</small></label>
  <label><input type="radio" name="level" value="hyper"> Super duper hyper cyber bro
    <small>Everything. Buttons, links, "Sign in, bro".</small></label>
  <p>Turning it down takes effect when you reload the tab.</p>
  <script src="bro.js"></script>
  <script src="popup.js"></script>
</body>
</html>
